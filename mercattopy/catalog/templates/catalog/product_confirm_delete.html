{% extends "base.html" %}
{% block content %}

<h3>Confirmar exclusão</h3>

<p>Deseja excluir o produto <strong>{{ product.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Excluir</button>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
